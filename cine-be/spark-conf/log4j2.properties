# Spark 3.5 Log4j2 Configuration — giảm noise, giữ log quan trọng

rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# ── Application logs — giữ ở INFO để thấy batch processing ──────────────────
logger.app.name = linh.vn.spark
logger.app.level = info
logger.app.additivity = false
logger.app.appenderRef.console.ref = console

# ── Spark Streaming progress — giữ để thấy batch đang xử lý ─────────────────
logger.microbatch.name = org.apache.spark.sql.execution.streaming.MicroBatchExecution
logger.microbatch.level = info
logger.microbatch.additivity = false
logger.microbatch.appenderRef.console.ref = console

logger.streamexec.name = org.apache.spark.sql.execution.streaming.StreamExecution
logger.streamexec.level = info
logger.streamexec.additivity = false
logger.streamexec.appenderRef.console.ref = console

# ── HBase RPC retry — chỉ hiện ERROR, WARN quá nhiều khi HBase chậm ─────────
logger.hbaseretry.name = org.apache.hadoop.hbase.client.RpcRetryingCallerImpl
logger.hbaseretry.level = error

logger.hbaserpc.name = org.apache.hadoop.hbase.ipc
logger.hbaserpc.level = error
