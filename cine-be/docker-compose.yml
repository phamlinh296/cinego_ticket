  #      - ./my-db:/var/lib/mysql
  #    networks:
  #      - cine-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
      - "29092:29092"
    #      them cổng 29092 để connect với cine-be chạy trên local IDE (localhost:29092) vì cổng 9092 chỉ dùng để kết nối nội bộ trong docker-compose (kafka:9092).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      #      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      #      1 cái là nội bộ (kafka:9092) để các service khác trong docker-compose kết nối, 1 cái là bên ngoài (localhost:29092) để connect vs cine-be chạy trên local IDE.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # add 2 dòng trên, Vì đang dùng nhiều listener name, nên phải chỉ định rõ broker sẽ dùng listener nào để giao tiếp nội bộ giữa các broker với nhau (inter-broker communication) và controller sẽ dùng listener nào để giao tiếp với broker.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Tạo sẵn topics khi start
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Cấu hình retention để tránh data loss cho Spark
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
    networks:
      - cine-net

  redis:
    image: redis:7.2
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - cine-net

  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
      - cine-net

  # HBase (standalone mode, embedded ZooKeeper disabled → dùng ZK trên)
  hbase:
    image: dajobe/hbase:latest
    container_name: hbase
    restart: always
    depends_on:
      - zookeeper
    environment:
      - HBASE_MANAGES_ZK=false
      - HBASE_ZOOKEEPER_QUORUM=zookeeper
      - HBASE_ZOOKEEPER_PROPERTY_CLIENTPORT=2181
    ports:
      - "16000:16000"   # HBase Master RPC
      - "16010:16010"   # HBase Master Web UI  → http://localhost:16010
      - "16020:16020"   # RegionServer RPC
      - "16030:16030"   # RegionServer Web UI
      - "9090:9090"     # Thrift Server (Java client dùng cổng này)
    volumes:
      - ./hbase-data:/data/hbase
      - ./hbase-init:/docker-entrypoint-initdb.d
    networks:
      - cine-net

  # HBase init: tạo tables khi container start lần đầu
  hbase-init:
    image: dajobe/hbase:latest
    container_name: hbase-init
    depends_on:
      - hbase
    entrypoint: >
      bash -c "
        sleep 30 &&
        echo \"
          create 'payment_history', 'cf'
          create 'fraud_logs', 'cf'
          create 'analytics_daily', 'cf'
          exit
        \" | hbase shell
      "
    networks:
      - cine-net
    restart: on-failure

  # ─────────────────────────────────────────
  # Spark Master
  # ─────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    restart: always
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark-jobs:/opt/spark-jobs
    networks:
      - cine-net

  # ─────────────────────────────────────────
  # Spark Worker
  # ─────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    restart: always
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - cine-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - cine-net

  redis-ui:
    image: redislabs/redisinsight:latest
    container_name: redis-ui
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - cine-net

networks:
  cine-net:
    driver: bridge