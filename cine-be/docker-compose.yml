  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
      - "29092:29092"
    #      them cổng 29092 để connect với cine-be chạy trên local IDE (localhost:29092) vì cổng 9092 chỉ dùng để kết nối nội bộ trong docker-compose (kafka:9092).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      #      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      #      1 cái là nội bộ (kafka:9092) để các service khác trong docker-compose kết nối, 1 cái là bên ngoài (localhost:29092) để connect vs cine-be chạy trên local IDE.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # add 2 dòng trên, Vì đang dùng nhiều listener name, nên phải chỉ định rõ broker sẽ dùng listener nào để giao tiếp nội bộ giữa các broker với nhau (inter-broker communication) và controller sẽ dùng listener nào để giao tiếp với broker.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Tạo sẵn topics khi start
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Cấu hình retention để tránh data loss cho Spark
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
    networks:
      - cine-net

  redis:
    image: redis:7.2
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - cine-net

  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
      - cine-net

  # HBase (standalone mode, embedded ZooKeeper disabled → dùng ZK trên)
  hbase:
    image: dajobe/hbase:latest
    container_name: hbase
    #    container khác resolve được hbase qua Docker DNS → không cần fix tay /etc/hosts nữa.
    hostname: hbase
    restart: always
    depends_on:
      - zookeeper
    environment:
      - HBASE_MANAGES_ZK=false
      - HBASE_ZOOKEEPER_QUORUM=zookeeper
      - HBASE_ZOOKEEPER_PROPERTY_CLIENTPORT=2181
    ports:
      - "16000:16000"   # HBase Master RPC
      - "16010:16010"   # HBase Master Web UI  → http://localhost:16010
      - "16020:16020"   # RegionServer RPC
      - "16030:16030"   # RegionServer Web UI
      - "9090:9090"     # Thrift Server (Java client dùng cổng này)
    volumes:
      - ./hbase-data:/data/hbase
    networks:
      - cine-net

  # HBase init: đã bỏ — tạo tables thủ công bằng docker exec (xem COMPLETE-TEST-GUIDE.md Bước 1)
  # hbase-init có bug YAML folded scalar khiến lệnh tạo bảng bị lỗi parsing.

  # ─────────────────────────────────────────
  # Spark Master
  # ─────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    restart: always
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark-jobs:/opt/spark-jobs
      - ./spark-conf/log4j2.properties:/opt/spark/conf/log4j2.properties
    networks:
      - cine-net

  # ─────────────────────────────────────────
  # Spark Worker
  # ─────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    restart: always
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./spark-conf/log4j2.properties:/opt/spark/conf/log4j2.properties
    networks:
      - cine-net

networks:
  cine-net:
    driver: bridge