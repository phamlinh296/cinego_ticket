# Loaded explicitly by the persistence test context, without application.yaml.
# Datasource credentials/URL come only from its disposable MySQL container.
# The container always starts empty and is deleted by Testcontainers. Avoid an
# initial DROP phase so halt_on_error checks schema creation, not missing tables.
spring.jpa.hibernate.ddl-auto=create-only
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=5
