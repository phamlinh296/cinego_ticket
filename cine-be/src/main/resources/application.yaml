server:
  port: ${PORT:9595}
  # servlet:
  #   context-path: /vephim

spring:
  application:
    name: cinegoticket
  config:
    import: classpath:application-health.yaml

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/cinego}
    #    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/abc}
    username: ${DATABASE_USERNAME:username}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 30s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: anomaly-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        #        spring.json.value.default.type: com.cinego.anomaly.dto.PaymentEvent #Spring JsonDeserializer tự map JSON → PaymentEvent. Nếu không có dòng này, nó sẽ báo lỗi ClassNotFoundException.
        #Không cần chỉ định containerFactory.
        #YAML chỉ hỗ trợ 1 type duy nhất → chỉ nhận được một DTO.

    listener:
      missing-topics-fatal: false

app:
  default_sender: ${MAIL_SENDER:}

jwt:
  signerKey: ${JWT_SECRET}
  valid-duration: 18000
  refreshable-duration: 18000
  email:
    domain: ${APP_PUBLIC_URL:http://localhost:9595}

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN

rate:
  limit:
    login:
      max-requests: 5
      duration-seconds: 60

hbase:
  zookeeper:
    quorum: ${HBASE_ZOOKEEPER_QUORUM:localhost}
    port: ${HBASE_ZOOKEEPER_PORT:2181}