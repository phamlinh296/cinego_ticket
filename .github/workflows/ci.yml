name: Java CI - Cinego Ticket

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            shared-model/pom.xml
            cine-be/pom.xml
            spark-processor/pom.xml
      - name: Test AI review and release guardrails without external API calls
        run: |
          node --test cine-be/automation/tests/ai-review.test.cjs
          python3 -m unittest discover -s cine-be/automation/tests -p 'test_*.py' -v
      - name: Verify Docker is available for MySQL integration tests
        run: docker info > /dev/null
      - name: Build and test backend with shared-model
        run: |
          sed -i 's/\r$//' ./mvnw
          chmod +x ./mvnw
          ./mvnw -B -ntp -pl cine-be -am verify
      - name: Upload unit and integration test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            shared-model/target/surefire-reports/
            cine-be/target/surefire-reports/
            cine-be/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

  docker-build-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./cine-be/Dockerfile.production
          push: false
          tags: cinego-be:ci

  release:
    needs: [build, docker-build-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CINEGO_RELEASE_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/backend-release.yml
    with:
      commit_sha: ${{ github.sha }}
